name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # SDL2 is built from source via FetchContent, so its X11 and audio
      # development headers have to be present.
      - name: Install SDL2 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxxf86vm-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libgl1-mesa-dev

      # The checked-in presets pin absolute compiler paths for one machine, so
      # CI configures directly and lets CMake pick the default generator.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      # Parallelism is capped: unbounded --parallel exhausted the process
      # limit on the macOS runner while building SDL2, Catch2 and ImGui at once
      # (posix_spawn: Resource temporarily unavailable).
      - name: Build
        run: cmake --build build --config Debug --parallel 3

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
